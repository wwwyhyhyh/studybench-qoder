[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studybench"
version = "1.0.0"
description = "学研台 StudyBench：seekdb 全文/2-gram/结构化混合检索 + PowerContext 任务记忆"
requires-python = ">=3.12"
dependencies = [
    "pylibseekdb>=1.3.0",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
studybench = "studybench.cli:main"
sb = "studybench.cli:main"

[tool.setuptools]
packages = ["studybench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
